[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Install deps before building:
#   forge install OpenZeppelin/openzeppelin-contracts
#   forge install foundry-rs/forge-std
# Then: forge test

[lint]
lint_on_build = false
